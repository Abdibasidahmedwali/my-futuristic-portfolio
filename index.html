<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Futuristic Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: linear-gradient(to right, #116a93, #928dab);
      color: white;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background-color: #111;
      animation: fadeInDown 1s ease;
    }
    .navbar-brand, .nav-link {
      color: #fff !important;
    }
    .hero {
      padding: 100px 0;
      text-align: center;
      animation: fadeIn 2s ease-in;
    }
    .hero h1 {
      font-size: 3rem;
      color: #f8f9fa;
    }
    .hero p {
      font-size: 1.2rem;
      margin-top: 20px;
      color: #e0e0e0;
    }
    .btn-dance {
      animation: dance 1s infinite alternate;
      background-color: #ff4081;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      color: white;
      border-radius: 50px;
    }
    .social-icon:hover {
      animation: glow 1s infinite alternate;
    }
    @keyframes fadeInDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes dance {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
    @keyframes glow {
      from { filter: drop-shadow(0 0 5px #0ff); }
      to { filter: drop-shadow(0 0 20px #0ff); }
    }
    footer {
      background-color: #111;
      padding: 30px 0;
      text-align: center;
      color: #aaa;
      animation: fadeInUp 1.5s ease;
    }
    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MyFuturisticPortfolio</a>
      <div>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <img src="/my-futuristic-portfolio/assets/me.-DrOAMF49.jpg" alt="Me" class="img-fluid rounded-circle mb-4" width="150">
      <h1>Welcome to My Colorful, Cool World!</h1>
      <p>I ❤️  Quran, playing chess, coding like a ninja, football like ozil, and repping Somalia 🇸🇴</p>
      <button class="btn btn-dance mt-4">Click Me! 💃</button>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>Follow Me Everywhere 📱</p>
    <div>
      <a href="https://facebook.com" class="me-3 social-icon"><i class="fab fa-facebook fa-2x"></i></a>
      <a href="https://instagram.com" class="me-3 social-icon"><i class="fab fa-instagram fa-2x"></i></a>
      <a href="https://tiktok.com" class="social-icon"><i class="fab fa-tiktok fa-2x"></i></a>
    </div>
    <p class="mt-3">&copy; 2025 Abdibasid's Cool Kingdom</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
